[project]
name = "pharmawatch-backend"
version = "0.1.0"
description = "Agentic AI for pharmaceutical fraud detection in Pakistan"
requires-python = ">=3.11"
authors = [
    { name = "Fozan Javaid" },
    { name = "Sultan Qureshi", email = "sultanqureshi111@outlook.com" },
]

dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.12",

    # Config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",

    # LLM — Gemini (the new SDK; google-generativeai is deprecated)
    "google-genai>=1.0.0",

    # Data
    "firebase-admin>=6.5.0",

    # Scraping (used by scripts/scrape_drap.py)
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",

    # PDF generation
    "reportlab>=4.2.5",

    # Utilities
    "python-slugify>=8.0.4",
    "rapidfuzz>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
